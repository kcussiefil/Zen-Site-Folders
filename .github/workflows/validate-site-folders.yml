name: Validate Zen Site Folders

on:
  pull_request:
    paths:
      - "site-folders*.uc.js"
      - "userChrome.css"
      - "theme.json"
      - "tests/**"
      - ".github/workflows/validate-site-folders.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scripts
        run: |
          node --check site-folders.uc.js
          node --check site-folders-hover.uc.js
          node --check site-folders-menu.uc.js
          node --check site-folders-collapse.uc.js
          node --check site-folders-drag.uc.js
          node --check site-folders-top-drop.uc.js
      - name: Check Sine metadata and script declarations
        run: |
          node -e "const m=require('./theme.json'); if(m.version !== '0.7.8' || !m.scripts['site-folders-hover.uc.js'] || !m.scripts['site-folders-menu.uc.js'] || !m.scripts['site-folders-collapse.uc.js'] || !m.scripts['site-folders-drag.uc.js'] || !m.scripts['site-folders-top-drop.uc.js']) process.exit(1)"
      - name: Test independent hover layer
        run: |
          node tests/hover-card.test.cjs
          node tests/zia-2.118-video-hover.test.cjs
          node tests/retired-blur-mod.test.cjs
          node tests/light-theme-contrast.test.cjs
          node tests/group-menu-order.test.cjs
          node tests/collapse.test.cjs
          node tests/member-handoff.test.cjs
          node tests/header-top-drop.test.cjs
          node tests/native-grab-anchor.test.cjs
          node tests/cross-group-selection.test.cjs
          node tests/snapshot-duplicate-id.test.cjs
          node tests/real-opened-session.test.cjs
          node tests/standalone-rules.test.cjs
          node tests/selected-color-age.test.cjs
          node tests/color-editor.test.cjs
          node tests/undo-secondary-click.test.cjs
          node tests/drag-feedback.test.cjs
          node tests/native-single-landing.test.cjs
          node tests/native-edge-scroll.test.cjs
          node tests/nested-drop.test.cjs
          node tests/expand-scroll-lifecycle.test.cjs
          node tests/ordered-rescue.test.cjs

  native-browser:
    name: Native Zen + Zia (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: z1n-k/zia
          ref: 41640ec290a55bf0afdbeccc9128123f8d0637f3
          path: .runtime/zia
          persist-credentials: false
      - name: Install pinned Zen 1.24b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/browser
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl --fail --location --retry 2 https://github.com/zen-browser/desktop/releases/download/1.24b/zen.linux-x86_64.tar.xz -o .runtime/zen.tar.xz
            echo '323f2682e73e38247a51fbcc75e5628ed2bb9b404db00cf9cf16af329a916fae  .runtime/zen.tar.xz' | sha256sum --check
            tar -xJf .runtime/zen.tar.xz -C .runtime/browser
            echo "ZEN_BINARY=$GITHUB_WORKSPACE/.runtime/browser/zen/zen" >> "$GITHUB_ENV"
          else
            curl --fail --location --retry 2 https://github.com/zen-browser/desktop/releases/download/1.24b/zen.macos-universal.dmg -o .runtime/zen.dmg
            echo '22915ea7e4f0c97a817b85b6ceba9b878317b8e1059390fcfe70dabaac8db86b  .runtime/zen.dmg' | shasum -a 256 --check
            hdiutil attach .runtime/zen.dmg -mountpoint "$RUNNER_TEMP/zen-volume" -nobrowse -readonly
            trap 'hdiutil detach "$RUNNER_TEMP/zen-volume" >/dev/null || true' EXIT
            zen_apps=( "$RUNNER_TEMP/zen-volume/"*.app )
            [[ ${#zen_apps[@]} == 1 && -d "${zen_apps[0]}" ]]
            ditto "${zen_apps[0]}" .runtime/browser/Zen.app
            test -x .runtime/browser/Zen.app/Contents/MacOS/zen
            hdiutil detach "$RUNNER_TEMP/zen-volume"
            trap - EXIT
            echo "ZEN_BINARY=$GITHUB_WORKSPACE/.runtime/browser/Zen.app/Contents/MacOS/zen" >> "$GITHUB_ENV"
          fi
      - name: Verify isolated Zia group landing first
        run: |
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "displayed slot up tab" --output native-results/zia-landing-up-tab
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "displayed slot down tab" --output native-results/zia-landing-down-tab
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "displayed slot up folder" --output native-results/zia-landing-up-folder
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "displayed slot down folder" --output native-results/zia-landing-down-folder
      - name: Verify real opening time survives native group collapse
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "grouped tab real opening time" --output native-results/grouped-open-age
      - name: Verify incremental site grouping preserves newest-first and manual order
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "incremental organize puts incoming tabs" --output native-results/incremental-organize
      - name: Verify v0.7.2 single-site filter and latest pre-sort snapshot
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "site v072 singleton organizer" --output native-results/v072-singleton
      - name: Verify v0.7.2 selected singleton stays at its former group slot
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "site v072 selected remaining" --output native-results/v072-selected
      - name: Verify v0.7.2 background singleton moves below groups
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "site v072 background remaining" --output native-results/v072-background
      - name: Verify v0.7.3 collapsed background preview close survivor remains visible
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "site v073 collapsed background preview close" --output native-results/v073-collapsed-visible
      - name: Verify v0.7.5 Zia light-space group label contrast
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "site v075 light theme label" --output native-results/v075-light-label
      - name: Compare original v0.6.7 bottom-pointer behaviour
        shell: bash
        run: |
          mkdir -p .runtime/original-v066
          git archive 90064c638473dadace4c447e43a20900ab900166 | tar -x -C .runtime/original-v066
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --repo .runtime/original-v066 --case "real-bottom-pointer" --output native-results/real-bottom-v066 || test -s native-results/real-bottom-v066/results.json
          python3 - <<'PY'
          import json
          d=json.load(open('native-results/real-bottom-v066/results.json'))
          p=d.get('pointerSamples') or []
          print('BASELINE POINTER v0.6.7:', {
            'platform':d.get('browser',{}).get('platform'),
            'errors':[q.get('error') for q in p],
            'nativeEvents':sum(len([e for e in q.get('events',[]) if e.get('type')=='dragover']) for q in p),
            'runnerError':d.get('runnerError')
          })
          PY
      - name: Test native WebDriver pointer from bottom boundary
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "real-bottom-pointer" --output native-results/real-bottom-pointer
      - name: Diagnose first upward drag at scrollTopMax
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "bottom-edge first upward motion" --output native-results/bottom-edge-first-motion
      - name: Verify bottom-up group pointer anchor with Zia
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "bottom-up group pointer" --output native-results/bottom-up-group-anchor
      - name: Verify native member takeover stays visible during scroll
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "native member drag edge scroll" --output native-results/member-scroll
      - name: Verify legacy pointer-only group fallback separately
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --case "whole group drag animates neighbour avoidance" --output native-results/group-fallback
      - name: Prove regressions fail on v0.3.8
        shell: bash
        run: |
          mkdir -p .runtime/baseline
          git archive f0b71ddee8f9caefad2864030e3f14fe714669b4 | tar -x -C .runtime/baseline
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --repo .runtime/baseline --output native-results/baseline && exit 1 || test -f native-results/baseline/results.json
          python3 tests/browser/check-baseline.py native-results/baseline/results.json
      - name: Verify selected-color panel in isolated native Zen
        run: python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --case "selected color editor" --output native-results/selected-color-panel
      - name: Compare whole native regression to v0.6.4 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/baseline-v064
          git archive 3cc9091725a44d621ed66ec73bc2929f77931232 | tar -x -C .runtime/baseline-v064
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --repo .runtime/baseline-v064 --output native-results/baseline-v064 || test -s native-results/baseline-v064/results.json
          python3 tests/browser/run.py --binary "$ZEN_BINARY" --zia-dir .runtime/zia --output native-results/candidate || test -s native-results/candidate/results.json
          python3 tests/browser/compare-candidate-v064.py native-results/baseline-v064/results.json native-results/candidate/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-zen-${{ matrix.os }}
          path: native-results/
